<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nexus docs</title>
  <meta name="description" content="Nexus documentation: search by keyword or filter by tag.">
  <link rel="icon" href="assets/img/logo.svg" type="image/svg+xml">
  <script>
    // Set the theme before first paint so there is no flash.
    (function () {
      var t = null;
      try { t = localStorage.getItem("nexus-theme"); } catch (e) {}
      if (t !== "light" && t !== "dark") {
        t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&family=JetBrains+Mono:wght@400;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <header class="top">
    <a class="brand" href="#/" aria-label="Nexus docs home">
      <img src="assets/img/logo.svg" alt="" width="26" height="26">
      <span>Nexus docs</span>
    </a>
    <form class="search search-top" role="search" id="search-top" autocomplete="off">
      <label class="sr" for="q-top">Search documentation</label>
      <input id="q-top" type="search" placeholder="Search docs" spellcheck="false">
      <kbd aria-hidden="true">/</kbd>
    </form>
    <button class="icon-btn" id="theme-toggle" type="button" aria-label="Switch color theme" title="Switch color theme">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 3a9 9 0 1 0 9 9c0-.5-.05-1-.14-1.47A6 6 0 0 1 12.47 3.14 9 9 0 0 0 12 3z"/></svg>
    </button>
  </header>

  <main id="main" tabindex="-1">
    <div id="view" aria-live="polite"></div>
  </main>

  <footer class="foot">
    <span>Nexus docs</span>
    <a id="repo-link" href="#" hidden>Source on GitHub</a>
  </footer>

  <noscript><p class="noscript">This site needs JavaScript to load the documentation.</p></noscript>

  <script src="assets/vendor/marked.umd.js"></script>
  <script src="assets/vendor/highlight.min.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
