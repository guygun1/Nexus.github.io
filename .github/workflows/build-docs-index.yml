name: Build docs index

# Rebuilds docs/documentation/manifest.json (and the asset version stamp in index.html) whenever documentation changes,
# so you can add or edit .md files (even from the GitHub web editor) and the
# search + navigation update on their own.

on:
  push:
    branches: [main]
    paths:
      - "docs/documentation/**"
      - "docs/assets/**"
      - "docs/scripts/build-index.mjs"

permissions:
  contents: write

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node docs/scripts/build-index.mjs
      - name: Commit manifest if it changed
        run: |
          if ! git diff --quiet -- docs/documentation/manifest.json docs/index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/documentation/manifest.json docs/index.html
            git commit -m "chore(docs): rebuild documentation index"
            git push
          fi
