name: Build docs site

# Safety net: rebuilds the generated pages (docs/doc, sitemap, search index, ...)
# when documentation or site files change on main, e.g. after editing a .md
# file in the GitHub web editor. Locally, run `node docs/scripts/build.mjs`
# before you commit.

on:
  push:
    branches: [main]
    paths:
      - "docs/documentation/**"
      - "docs/assets/**"
      - "docs/scripts/**"
      - "docs/site.config.json"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node docs/scripts/build.mjs
      - name: Commit generated files if they changed
        run: |
          git add -A docs
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(docs): rebuild site"
            git push
          fi
